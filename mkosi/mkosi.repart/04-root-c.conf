[Partition]
# ROOT-C: a reserved, unused slot kept ONLY to preserve Flatcar's canonical GPT
# partition numbering (OEM=6, ROOT=9). Upstream's disk_layout.json declares it as
# a zero-size "blank"; systemd-repart can't leave numbering gaps, so we allocate a
# tiny real partition to occupy slot 5. Nothing reads it.
Type=linux-generic
Label=ROOT-C
SizeMinBytes=1M
SizeMaxBytes=1M
