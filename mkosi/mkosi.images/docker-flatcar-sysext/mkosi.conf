[Config]
Dependencies=base
             containerd-flatcar-sysext

[Output]
Format=sysext
Overlay=yes
Output=docker-flatcar

[Content]
BaseTrees=%O/base
          %O/containerd-flatcar.raw
          %O/containerd-flatcar-sysext-pkgdb
# containerd-flatcar.raw carries only /usr, so without its pkgdb portage
# re-merges containerd and runc here. Equivalent of build_sysext --base_pkginfo.
# Shared hook: Packages=/RemovePackages= readback -> SDK emerge (tools/prepare.sh).
PrepareScripts=%D/tools/prepare.sh
# Save this image's pkgdb for the combined license manifest (see tools/write-licenses.sh).
PostInstallationScripts=%D/tools/save-pkgdb.sh
FinalizeScripts=%D/tools/sysext-mangle.sh
Packages=app-containers/docker
         app-containers/docker-cli
         app-containers/docker-buildx
SELinuxRelabel=no
