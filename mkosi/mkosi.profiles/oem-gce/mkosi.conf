# gce image: the oem-gce sysext on the OEM partition and the vm disk
# layout, as image_to_vm.sh --format=gce builds it.

[Config]
Dependencies=oem-gce-sysext

[Output]
Output=flatcar_production_gce_image

[Build]
# mkosi.postinst.d/06-oem.sh runs install_oem_sysext for this VM type.
Environment=FLATCAR_VM_TYPE=gce
