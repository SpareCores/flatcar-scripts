# openstack image: the oem-openstack sysext on the OEM partition and the vm disk layout,
# as image_to_vm.sh --format=openstack builds it.

[Config]
Dependencies=oem-openstack-sysext

[Output]
Output=flatcar_production_openstack_image

[Build]
# mkosi.postinst.d/06-oem.sh runs install_oem_sysext for this VM type.
Environment=FLATCAR_VM_TYPE=openstack
