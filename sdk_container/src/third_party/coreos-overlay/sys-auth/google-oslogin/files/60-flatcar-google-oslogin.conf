# Needed for google oslogin. sshd uses the first AuthorizedKeysCommand
# it reads and systemd's 20-systemd-userdb.conf sets one too, so this
# file is linked as 10-flatcar-google-oslogin.conf by the OEM and runs
# the userdb command with the OS Login one chained behind it.
AuthorizedKeysCommand /usr/bin/userdbctl ssh-authorized-keys %u --chain /usr/bin/google_authorized_keys %u
AuthorizedKeysCommandUser root
