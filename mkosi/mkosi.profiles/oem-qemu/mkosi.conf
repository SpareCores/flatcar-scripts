# qemu_uefi image: the oem-qemu sysext on the OEM partition and the vm disk
# layout, as image_to_vm.sh --format=qemu_uefi builds it.

[Config]
Dependencies=oem-qemu-sysext

[Output]
Output=flatcar_production_qemu_uefi_image

[Build]
# mkosi.postinst.d/06-oem.sh runs install_oem_sysext for this VM type.
Environment=FLATCAR_VM_TYPE=qemu_uefi
