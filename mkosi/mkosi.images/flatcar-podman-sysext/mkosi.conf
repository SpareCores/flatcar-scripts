# Extra sysext, built only with --profile=extra-sysexts (build_image's sysext target).
[Config]
Dependencies=base

[Output]
Format=sysext
Overlay=yes
Output=flatcar-podman
ImageId=flatcar-podman

[Content]
BaseTrees=%O/base
# Shared hook: Packages=/RemovePackages= readback -> SDK emerge (tools/prepare.sh).
PrepareScripts=%D/tools/prepare.sh
# Save this image's pkgdb for the combined license manifest (see tools/write-licenses.sh).
PostInstallationScripts=%D/tools/save-pkgdb.sh
FinalizeScripts=%D/tools/sysext-mangle.sh
Packages=app-containers/podman
         net-misc/passt
SELinuxRelabel=no

[Build]
# build_sysext's default --compression=lz4hc (build_sysext:314-326).
Environment="SYSTEMD_REPART_MKFS_OPTIONS_EROFS=-zlz4hc,12 -C65536 -Efragments,ztailpacking"
