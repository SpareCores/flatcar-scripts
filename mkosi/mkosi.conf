# SPDX-License-Identifier: LGPL-2.1-or-later
#
# Bootable Flatcar disk, assembled from the base sub-image (%O/base).
# Default build is minimal (no OEM); `--profile oem-qemu` adds the OEM sysext.
# See README.md.

[Distribution]
# custom: the SDK provides the packages. Its backend is a no-op, which is what
# frees the mkosi-* helper names for tools/bin (see tools/prepare.sh).
# No Release=/Architecture pinning to a bincache: packages come from the board
# sysroot at /build/<board>, derived from Architecture=.
Distribution=custom
Architecture=x86-64

[Config]
# Sub-images the disk always needs. OEM profiles APPEND their oem-<flavor>-sysext
# (list settings accumulate), so the default build stays OEM-free.
# containerd-flatcar/docker-flatcar are Flatcar's DEFAULT built-in sysexts
# (build_image:42 base_sysexts) — baked into /usr by the top-level mkosi.postinst.
Dependencies=base
             containerd-flatcar-sysext
             docker-flatcar-sysext
PassEnvironment=FLATCAR_UPDATE_GROUP FLATCAR_IMAGE_PROFILE FLATCAR_SOURCE_BUILD
                FLATCAR_ALLOW_REMOTE_BINPKGS
                MODULES_SIGN_KEY MODULES_SIGN_CERT MODULE_SIGNING_KEY_DIR
                COREOS_OFFICIAL

[Output]
OutputDirectory=mkosi.output
Format=disk
# Pin the output name. mkosi.version feeds %v (used to name the OEM sysext), but
# ImageVersion also gets appended to the default output filename, which would
# make it image_<version>.raw and break mkosi.postoutput (it pins the disk GUID
# of image.raw) and every consumer expecting a stable path.
Output=image

[Build]
# The board sysroot, writable: from-source builds emerge build deps into it.
# Targets are re-rooted under /work/src (Config.with_prefix), so the absolute
# /build the cross toolchain's --sysroot and the setup_board wrappers expect is
# restored by a symlink in lib/lib.sh. Note this is the real SDK /build: hooks
# now mutate container state that no `mkosi -ff` undoes.
#
# %D re-adds the config dir at /work/src. Setting BuildSources= at all drops
# mkosi's default CWD mount, and $SRCDIR is hardcoded to /work/src -- without
# this every hook's `. ${SRCDIR}/lib/lib.sh` fails.
BuildSources=%D:
             /build/:build
# Source tarballs for from-source builds. make.conf's DISTDIR
# (/mnt/host/source/.cache/distfiles, 2.6G already cached) is not bound into the
# sandbox; without this portage silently creates an empty one on the sandbox
# tmpfs and re-fetches everything each build. Unlike /build the path need not be
# preserved -- lib/lib.sh exports DISTDIR to point here.
             /mnt/host/source/.cache/distfiles:distfiles
# Kernel module signing keys (sdk_entry.sh: a persistent dir for unofficial
# builds, a /tmp one for official). Source builds of the kernel create the key
# here and kmod packages sign with it; lib/lib.sh binds it back at its own path.
# Needs `sudo --preserve-env=MODULES_SIGN_KEY,MODULES_SIGN_CERT,MODULE_SIGNING_KEY_DIR,COREOS_OFFICIAL`,
# as build_packages does for emerge.
             ${MODULE_SIGNING_KEY_DIR}:module-signing-keys
# Cache the emerged base tree so iterating on later stages does not re-merge all
# ~330 packages every run. Both dirs live on the bind-mounted host filesystem
# (ext4): the container's own /var/tmp is overlayfs, and mkosi's cache copy
# (cp --preserve=...,xattr) fails there on security.selinux xattrs, while
# overlayfs also refuses an upperdir that is itself on overlayfs.
#
# Invalidation: the cache manifest hashes Packages=, RemovePackages= and the
# CONTENTS of PrepareScripts=, so editing tools/prepare.sh rebuilds correctly.
# It does NOT cover mkosi.postinst, mkosi.finalize or tools/bin/lib.sh -- after
# changing those, force a rebuild with `mkosi -ff` (or `mkosi clean`).
#
# FLATCAR_IMAGE_PROFILE=prod/dev
#
# FLATCAR_SOURCE_BUILD=1 adds a from-source pass for each image's Packages=
# closure (tools/prepare.sh), so a locally edited ebuild reaches the image
# without ./build_packages. Set it to 0 for a strictly binpkg-only build.
# Note the cache manifest does NOT hash Environment=, so toggling this over a
# warm cache needs `mkosi -ff`.
# FLATCAR_ALLOW_REMOTE_BINPKGS=1 lets the source-build pass download a matching
# binpkg from PORTAGE_BINHOST instead of compiling. Set it to 0 when editing an
# ebuild without bumping -rN, or the remote package wins and the edit is lost.
Environment=FLATCAR_UPDATE_GROUP=developer FLATCAR_IMAGE_PROFILE=prod
            FLATCAR_SOURCE_BUILD=1
            FLATCAR_ALLOW_REMOTE_BINPKGS=1
            # Bare names take the value from mkosi's own (sudo-preserved) env.
            MODULES_SIGN_KEY MODULES_SIGN_CERT MODULE_SIGNING_KEY_DIR
            COREOS_OFFICIAL

Incremental=yes
CacheDirectory=/mnt/host/source/src/build/mkosi.cache
PackageCacheDirectory=/var/tmp/mkosi.pkgcache
# Workspace must be on the SAME filesystem as OutputDirectory, and not on the
# container's overlayfs /var/tmp:
#  - overlayfs refuses an upperdir that is itself on overlayfs, so sub-images
#    fail to mount base trees (OSError: [Errno 22] Invalid argument).
#  - /mnt/host/source/src/build is a DIFFERENT bind mount than .../src/scripts,
#    so mkosi cannot rename the staged image into mkosi.output and falls back to
#    copying -- which happens AFTER mkosi.postoutput, silently discarding the
#    pinned disk GUID and leaving the initrd GPT repair (bootengine
#    disk-uuid.sh) dead. Keeping it beside mkosi.output makes it a
#    rename again.
WorkspaceDirectory=/mnt/host/source/src/scripts/.mkosi.workspace
# Puts tools/bin/mkosi-* on the hook PATH. Works only because custom's
# package_manager().scripts() is empty, leaving those names unclaimed.
# (ExtraSearchPaths= rejects paths under /usr.)
#
# ExtraSearchPaths entries are also --ro-bind'ed into the script sandbox at
# their own path (Config.sandbox()), which is how the ebuild repos become
# visible to emerge inside the hook. The board sysroot is NOT here: it needs to
# be writable for from-source builds, so it comes in via BuildSources= above.
# The sysroot's make.profile symlinks into coreos-overlay and its repos.conf
# points at these repo locations, so they must be bound or portage reports
# "profile is not a symlink" / "Unavailable repository".
# The third repo, x-crossdev (/usr/local/portage/crossdev), is deliberately
# omitted: ExtraSearchPaths= rejects paths under /usr, and it is an empty
# toolchain scratch repo (no ebuilds) that image packages never come from.
ExtraSearchPaths=%D/tools/bin
                 /mnt/host/source/src/third_party/coreos-overlay
                 /mnt/host/source/src/third_party/portage-stable
# The SDK host's package database. IDEPENDs (install-time deps) are satisfied
# from BROOT, i.e. the build host root /, not the target ROOT -- glibc IDEPENDs
# on sys-apps/locale-gen, which IS installed in the SDK but has no binpkg.
# Without this bind portage cannot see it and fails with
#   no binary packages to satisfy "sys-apps/locale-gen"
#   (dependency required by "sys-libs/glibc" [binary])
# Read-only on purpose: hooks must not mutate the SDK's own package database.
# That means --with-bdeps y cannot merge BDEPENDs into BROOT from a hook.
                 /var/db/pkg
# The SDK versionfile (sdk_container/.repo/manifests/version.txt). common.sh
# sources it for FLATCAR_VERSION / FLATCAR_VERSION_ID, which set_lsb_release
# writes into os-release. Not bound by default, so the hook cannot see it.
                 /mnt/host/source/.repo
# The SDK scripts tree: hooks call build_library/* directly (set_lsb_release,
# gen_tmpfiles.py, ...). Those source ../common.sh, so bind the whole tree.
                 /mnt/host/source/src/scripts
# The sandbox gets a bare `--dir /etc`: copy in what SDK scripts need. Copying
# /etc wholesale instead trips over its dangling symlinks: mkosi overwrites
# nsswitch.conf, and /etc/nsswitch.conf -> ../usr/share/baselayout/... dangles
# in the staging dir, so the write fails with ENOENT.
#   portage        BROOT's config, which --config-root does not cover
#   debian_chroot  common.sh INSIDE_CHROOT -> assert_inside_chroot
#   xml, sgml      catalogs; without them xsltproc exits 5 on docbook man pages
#   sandbox.conf/d sandbox(1)'s own config, else ~500 ACCESS DENIED warnings
SandboxTrees=/etc/portage:/etc/portage
             /etc/debian_chroot:/etc/debian_chroot
             /etc/xml:/etc/xml
             /etc/sgml:/etc/sgml
             /etc/sandbox.conf:/etc/sandbox.conf
             /etc/sandbox.d:/etc/sandbox.d

[Content]
# OS userland comes from the base sub-image. With BaseTrees= and no Packages=,
# mkosi copies the base tree in instead of re-emerging (see flatcar.py). The
# gcc-runtime overlay adds the C++ runtime (libstdc++/libgcc_s) into /usr/lib64.
BaseTrees=%O/base
Bootable=yes
# Bootloader=none: mkosi's built-in grub install wants grub modules IN the image
# root. mkosi.postinst runs build_library/grub_install.sh instead, writing the
# signed EFI tree to /efi, which 00-esp.conf copies onto EFI-SYSTEM.
Bootloader=none
# Empty Initrds= disables the default-initrd; Flatcar's bootengine is in-kernel.
Initrds=
SELinuxRelabel=no
# Ignored: Flatcar's grub.cfg builds the kernel command line at boot.
# KernelCommandLine=console=ttyS0,115200 consoleblank=0 console=hvc0 loglevel=7 mount.usrflags=ro mount.usr=PARTLABEL=USR-A rootflags=rw root=LABEL=ROOT flatcar.first_boot=1

[Validation]
# mkosi disk-verity stays OFF: Flatcar enforces /usr verity via the kernel-embedded
# hash + grub (verity.usr=), not repart partitions. The key/cert are still declared
# so the oem-qemu sub-image (scope=universal) inherits them to sign its DDI, and the
# cert is installed into /usr/lib/verity.d/ as the sysext trust anchor. See README.
Verity=disabled
VerityKey=mkosi.key
VerityCertificate=mkosi.crt

[Runtime]
# Boot the image from a snapshot so `mkosi vm` does not hold an exclusive lock
# on mkosi.output/image. Without it a running VM blocks the next build -- and
# `mkosi -f` deletes the outputs BEFORE it checks the lock, so the build both
# fails and leaves the tree empty.
Ephemeral=yes
