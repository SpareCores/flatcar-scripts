# stackit image: the oem-stackit sysext on the OEM partition and the vm disk layout,
# as image_to_vm.sh --format=stackit builds it.

[Config]
Dependencies=oem-stackit-sysext

[Output]
Output=flatcar_production_stackit_image

[Build]
# mkosi.postinst.d/06-oem.sh runs install_oem_sysext for this VM type.
Environment=FLATCAR_VM_TYPE=stackit
