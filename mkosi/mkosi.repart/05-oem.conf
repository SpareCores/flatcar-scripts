[Partition]
# OEM partition (slot 6) — always present, matching Flatcar's canonical layout
# (disk_layout.json). Empty by default; an oem-<flavor> profile stages /oem-tree
# into the buildroot (ExtraTrees + mkosi.oem-finalize) and CopyFiles pulls it in.
# The top-level mkosi.postinst always creates an empty /oem-tree so this CopyFiles
# has a source even in no-profile builds (repart treats a missing CopyFiles source
# as fatal, not a skip). The staged tree is kept out of ROOT by
# ExcludeFiles=/oem-tree in 09-root.conf.
# Type is the generic "data" GPT GUID (disk_layout.json OEM type=data), matching
# upstream; runtime finds this partition by LABEL=OEM (oem.mount), not the type.
Type=EBD0A0A2-B9E5-4433-87C0-68B6B72699C7
Format=btrfs
Label=OEM
CopyFiles=/oem:/
SizeMinBytes=1G
SizeMaxBytes=1G
