# ami image: the oem-ami sysext on the OEM partition and the vm disk
# layout, as image_to_vm.sh --format=ami builds it.

[Config]
Dependencies=oem-ami-sysext

[Output]
Output=flatcar_production_ami_image

[Build]
# mkosi.postinst.d/06-oem.sh runs install_oem_sysext for this VM type.
Environment=FLATCAR_VM_TYPE=ami
