# akamai image: the oem-akamai sysext on the OEM partition and the base disk layout,
# as image_to_vm.sh --format=akamai builds it.

[Config]
Dependencies=oem-akamai-sysext

[Output]
Output=flatcar_production_akamai_image

[Build]
# mkosi.postinst.d/06-oem.sh runs install_oem_sysext for this VM type.
Environment=FLATCAR_VM_TYPE=akamai
