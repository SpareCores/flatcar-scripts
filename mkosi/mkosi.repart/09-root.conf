[Partition]
# flatcar-resize type (NOT plain `root`): Flatcar's extend-filesystems.service
# only grows ROOT when its GPT type is this GUID (COREOS_RESIZE), giving runtime
# root growth. Trade-off: repart loses PARTITION_ROOT recognition, so its
# automatic APIVFS/other-mountpoint exclusion from CopyFiles=/ no longer applies
# — we exclude those explicitly below (our build tree's /proc,/sys,/dev,/tmp are
# empty and /run only has /run/lock, so this is belt-and-suspenders).
Type=3884dd41-8582-4404-b9a8-e9b84f2df50e
Format=ext4
Label=ROOT
CopyFiles=/
# Trailing slash = DENY_CONTENTS: exclude everything UNDER /usr but keep the empty
# /usr mountpoint dir. systemd-repart's ExcludeFiles does NOT glob-expand; the old
# "/usr/*" was stat()'d literally, matched nothing, and leaked the whole 1.4 GB
# /usr onto ROOT (verity /usr is the real one; the ROOT copy just wasted space and
# starved cl.swap_activation's 1 GB swapfile).
ExcludeFiles=/usr/
# Verity /usr blob staged by mkosi.finalize for USR-A's CopyBlocks; not part of ROOT.
ExcludeFiles=/usr.img
ExcludeFiles=/boot
ExcludeFiles=/efi
# APIVFS + pseudo-fs mountpoints — previously auto-excluded by repart's
# PARTITION_ROOT logic, now explicit since we use the flatcar-resize type.
ExcludeFiles=/proc
ExcludeFiles=/sys
ExcludeFiles=/dev
ExcludeFiles=/run
ExcludeFiles=/tmp
# Staging dir for an oem-<flavor> profile's OEM partition contents. It is placed
# into the buildroot by ExtraTrees=oem-tree:/oem-tree and consumed by the OEM
# partition's CopyFiles=/oem-tree:/, so keep it out of ROOT. Harmless (no-op)
# when building without an OEM profile since /oem-tree won't exist.
ExcludeFiles=/oem/
SizeMinBytes=2G
