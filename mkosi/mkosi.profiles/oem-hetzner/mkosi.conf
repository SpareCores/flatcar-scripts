# hetzner image: the oem-hetzner sysext on the OEM partition and the vm disk layout,
# as image_to_vm.sh --format=hetzner builds it.

[Config]
Dependencies=oem-hetzner-sysext

[Output]
Output=flatcar_production_hetzner_image

[Build]
# mkosi.postinst.d/06-oem.sh runs install_oem_sysext for this VM type.
Environment=FLATCAR_VM_TYPE=hetzner
