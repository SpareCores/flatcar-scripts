[Partition]
# Flatcar's flatcar-usr GPT type; grub's gptprio.next hardcodes this GUID
# (GRUB_GPT_PARTITION_TYPE_USR_X86_64) to find the bootable USR partition.
Type=5dfbf5f4-2848-4bac-aa5e-0d9a20b745a6
Label=USR-A
# One blob (btrfs + verity hash tree) built by mkosi.finalize. CopyBlocks writes
# it verbatim; repart must NOT reformat it or the injected root hash won't match.
CopyBlocks=/usr.img
# 2 GiB = upstream disk_layout.json USR-A/USR-B blocks 4194304 * 512. A and B
# MUST be identical (an A->B or B->A update payload has to fit either slot), and
# matching upstream keeps update payloads size-compatible. Verity blob is ~1.02G.
SizeMinBytes=2G
SizeMaxBytes=2G
# gptprio bits so grub's gptprio.next boots USR-A: 48 (priority=1) + 56
# (successful) = 1<<48 | 1<<56. USR-B stays 0 (passive/update slot).
Flags=72339069014638592
UUID=7130c94a-213a-4e5a-8e26-6cce9662f132
