# Extra sysext, built only with --profile=extra-sysexts (build_image's sysext target).
# extra_sysexts.sh limits it to amd64.
[Match]
Architecture=x86-64

[Config]
Dependencies=base

[Output]
Format=sysext
Overlay=yes
Output=flatcar-nvidia-drivers-550
ImageId=flatcar-nvidia-drivers-550

[Content]
BaseTrees=%O/base
# Shared hook: Packages=/RemovePackages= readback -> SDK emerge (tools/prepare.sh).
PrepareScripts=%D/tools/prepare.sh
# Save this image's pkgdb for the combined license manifest (see tools/write-licenses.sh).
PostInstallationScripts=%D/tools/save-pkgdb.sh
FinalizeScripts=%D/tools/sysext-mangle.sh
Packages=x11-drivers/old-nvidia-drivers:0/550
SELinuxRelabel=no

[Build]
# build_sysext's lz4hc default minus ztailpacking: with fragments it corrupts
# file tails in this tree (erofs-utils <= 1.9.4, fixed by b5be7cf).
Environment="SYSTEMD_REPART_MKFS_OPTIONS_EROFS=-zlz4hc,12 -C65536 -Efragments"
# USE flags from extra_sysexts.sh.
            "USE=-kernel-open persistenced"
