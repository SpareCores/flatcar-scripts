# oraclecloud image: the oem-oraclecloud sysext on the OEM partition and the vm disk layout,
# as image_to_vm.sh --format=oraclecloud builds it.

[Config]
Dependencies=oem-oraclecloud-sysext

[Output]
Output=flatcar_production_oraclecloud_image

[Build]
# mkosi.postinst.d/06-oem.sh runs install_oem_sysext for this VM type.
Environment=FLATCAR_VM_TYPE=oraclecloud
