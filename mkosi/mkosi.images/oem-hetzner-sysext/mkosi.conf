[Config]
Dependencies=base

[Output]
Format=sysext
Overlay=yes
Output=oem-hetzner
ImageId=oem-hetzner

[Content]
# Overlay the base /usr; only the delta is packaged.
BaseTrees=%O/base
# Shared hook: Packages=/RemovePackages= readback -> SDK emerge (tools/prepare.sh).
PrepareScripts=%D/tools/prepare.sh
# Save this image's pkgdb for the combined license manifest (see tools/write-licenses.sh).
PostInstallationScripts=%D/tools/save-pkgdb.sh
FinalizeScripts=%D/tools/sysext-mangle.sh
Packages=coreos-base/oem-hetzner
SELinuxRelabel=no

# Payload is uncompressed EROFS by default  matching upstream # --compression=none
# (OEM sysexts live in the already-compressed btrfs OEM part).
# Verity key/cert are inherited from the top-level mkosi.conf
