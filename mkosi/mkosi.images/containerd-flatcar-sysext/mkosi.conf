[Config]
Dependencies=base

[Output]
Format=sysext
Overlay=yes
# Output=containerd-flatcar keeps the DDI named containerd-flatcar.raw, matching
# the upstream built-in sysext name.
Output=containerd-flatcar

[Content]
# Overlay the base /usr so only the containerd delta is packaged. VERSION_ID/ID
# for the extension-release come from the base os-release, so they match the
# target OS (a sysext only merges when VERSION_ID matches).
BaseTrees=%O/base
# Shared hook: Packages=/RemovePackages= readback -> SDK emerge (tools/prepare.sh).
PrepareScripts=%D/tools/prepare.sh
# Save this image's pkgdb for the combined license manifest (see tools/write-licenses.sh).
PostInstallationScripts=%D/tools/save-pkgdb.sh
FinalizeScripts=%D/tools/sysext-mangle.sh
Packages=app-containers/containerd
SELinuxRelabel=no
