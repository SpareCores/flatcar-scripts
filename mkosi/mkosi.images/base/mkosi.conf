# install the base OS into a directory, so we can build overlays on top of it (like sysexts)

[Output]
Format=directory
# pin the name, otherwise mkosi.version would be used as suffix
Output=base

[Content]
# mkosi.prepare (next to this file) is auto-detected and base-only. mkosi puts
# auto-detected scripts BEFORE explicit ones, so it runs ahead of the shared
# tools/prepare.sh, i.e. before Packages= is installed.
PrepareScripts=%D/tools/prepare.sh
# @system coreos-devel/board-packages
Packages=coreos-base/coreos
# Packages=@system coreos-devel/board-packages
SELinuxRelabel=no
