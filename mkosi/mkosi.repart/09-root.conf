[Partition]
# flatcar-resize type (NOT plain `root`): Flatcar's extend-filesystems.service
# only grows ROOT when its GPT type is this GUID (COREOS_RESIZE), giving runtime
# root growth.
Type=3884dd41-8582-4404-b9a8-e9b84f2df50e
Format=ext4
Label=ROOT
# Empty like upstream: /etc and /var are recreated at first boot from the
# /usr/share/flatcar/etc + confext overlay and tmpfiles (base_image_var*.conf).
MakeDirectories=/boot /oem /usr
SizeMinBytes=2G
