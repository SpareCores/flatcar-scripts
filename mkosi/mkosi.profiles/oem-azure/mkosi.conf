# azure image: the oem-azure sysext on the OEM partition and the azure disk
# layout, as image_to_vm.sh --format=azure builds it.

[Config]
Dependencies=oem-azure-sysext

[Output]
Output=flatcar_production_azure_image

[Build]
# mkosi.postinst.d/06-oem.sh runs install_oem_sysext for this VM type.
Environment=FLATCAR_VM_TYPE=azure
