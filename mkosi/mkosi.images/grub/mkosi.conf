# grub overlay: builds the standalone EFI GRUB image + shim, ported from
# upstream grub_install.sh Emerge grub/shim onto base purely as build tooling,
# run grub-mkimage in mkosi.finalize, emit efi/ into the image, discard the
# rest.

[Config]
Dependencies=base

[Output]
Format=directory
Output=grub
Overlay=yes

[Content]
# Overlay base /usr so grub-mkimage, grub modules, shim and sbat.csv are present
# at build time; nothing here ships in the OS image.
BaseTrees=%O/base
# Shared hook: Packages=/RemovePackages= readback -> SDK emerge (tools/prepare.sh).
PrepareScripts=%D/tools/prepare.sh
Packages=sys-boot/grub
         sys-boot/shim
SELinuxRelabel=no
Bootable=no
