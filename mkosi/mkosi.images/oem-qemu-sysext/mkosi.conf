[Config]
Dependencies=base

[Output]
Format=sysext
Overlay=yes
# Output=oem-qemu keeps the DDI named oem-qemu.raw (not the default oem-qemu_0.0.2.raw).
# ImageId -> SYSEXT_ID, ImageVersion -> SYSEXT_VERSION_ID (the ebuild PVR).
Output=oem-qemu
ImageId=oem-qemu
ImageVersion=0.0.2

[Content]
# Overlay the base /usr; only the delta is packaged. VERSION_ID/ID for the
# extension-release come from the base os-release, so they match the target OS.
BaseTrees=%O/base
# Shared hook: Packages=/RemovePackages= readback -> SDK emerge (tools/prepare.sh).
PrepareScripts=%D/tools/prepare.sh
# Save this image's pkgdb for the combined license manifest (see tools/write-licenses.sh).
PostInstallationScripts=%D/tools/save-pkgdb.sh
Packages=coreos-base/oem-qemu
SELinuxRelabel=no

# Payload is uncompressed EROFS by default  matching upstream # --compression=none
# (OEM sysexts live in the already-compressed btrfs OEM part).
# Verity key/cert are inherited from the top-level mkosi.conf
